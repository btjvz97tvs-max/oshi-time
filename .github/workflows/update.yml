name: 推しデータを更新して公開

# GitHub の時刻指定（schedule）は混み具合で何時間も遅れることがあるので、
# 毎回の最後に「5分後の次の回」を自分で予約して、つなげて動かす（GitHub の仕組みで同時に動くのは1回分だけ）。
# schedule は、そのつながりが何かで切れたときに、また動かし始めるための予備。
# 止めたいときは、Actions 画面で実行中の回を「Cancel workflow」する（予約されなくなる）。
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:          # Actions画面の「Run workflow」で今すぐ更新（止めたあとの再開もこれ）
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write              # 次の回を予約するため

concurrency:
  group: oshi-time-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      started: ${{ steps.start.outputs.at }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: start
        name: 開始時刻を記録
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: にじさんじのデータを取得
        env:
          HOLODEX_API_KEY: ${{ secrets.HOLODEX_API_KEY }}
        run: node scripts/fetch-data.mjs

      # 60日間なにも更新が無いと時刻指定の実行が止まるので、週に1回だけ小さな記録を残す
      - name: 自動更新を止めないための記録
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 604800 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "自動更新の維持"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4

  # 更新が失敗しても止まらないよう、次の回の予約は別の作業として必ず行う
  next:
    needs: update
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 5分後の次の回を予約
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.update.outputs.started }}
        run: |
          now=$(date +%s)
          started=${STARTED:-$now}
          # 次の回が動き出すまでの待ち時間（30秒ほど）を見込んで、この回の開始から5分後に始まるようにする
          wait=$(( started + 300 - 30 - now ))
          if [ "$wait" -gt 0 ]; then
            echo "${wait}秒待ってから次の回を予約します"
            sleep "$wait"
          fi
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
